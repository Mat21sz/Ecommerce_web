<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorShop - E-commerce</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">ColorShop 🛍️</h1>
    </header>
    
    <main class="main-content">
        <section class="products">
            <h2 class="products__title">Nuestros Productos</h2>
            <div id="product-list" class="products__grid">
                <!-- Los productos se inyectarán aquí vía JS -->
            </div>
        </section>
        
        <aside class="cart">
            <h2 class="cart__title">Tu Carrito 🛒</h2>
            <ul id="cart-list" class="cart__list">
                <p class="cart__empty-msg">El carrito está vacío</p>
            </ul>
            <div class="cart__summary">
                <span class="cart__total-label">Total:</span>
                <span id="cart-total" class="cart__total-price">$0.00</span>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
